<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小蛇蛇大冒险</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #ffe9a7 0%, #a7e0ff 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #333;
  }
  h1 {
    font-size: 36px;
    color: #ff6b6b;
    text-shadow: 2px 2px 0 #fff;
    margin-bottom: 10px;
  }
  .info {
    display: flex;
    gap: 30px;
    margin-bottom: 12px;
    font-size: 22px;
    font-weight: bold;
  }
  .score { color: #2e8b57; }
  .best { color: #ff8c00; }
  .game-wrap {
    width: 80vw;
    max-width: 600px;
    aspect-ratio: 1 / 1;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    padding: 12px;
    position: relative;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #f4fff4;
    border-radius: 10px;
    border: 4px solid #88d488;
  }
  .overlay {
    position: absolute;
    inset: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.92);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 {
    font-size: 32px;
    color: #ff6b6b;
    margin-bottom: 12px;
  }
  .overlay p {
    font-size: 20px;
    margin-bottom: 16px;
    color: #555;
  }
  button {
    font-size: 22px;
    padding: 12px 28px;
    border-radius: 30px;
    border: none;
    background: #ff6b6b;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #c94a4a;
    transition: transform 0.1s;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #c94a4a; }
  .tip {
    margin-top: 14px;
    font-size: 16px;
    color: #666;
  }
  .pad {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
  }
  .pad button {
    font-size: 24px;
    padding: 0;
    background: #ffb347;
    box-shadow: 0 3px 0 #c98a1f;
  }
  .pad .up    { grid-column: 2; grid-row: 1; }
  .pad .left  { grid-column: 1; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad .down  { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>
  <h1>小蛇蛇大冒险</h1>
  <div class="info">
    <span class="score">得分: <span id="score">0</span></span>
    <span class="best">最高: <span id="best">0</span></span>
  </div>
  <div class="game-wrap">
    <canvas id="game" width="600" height="600"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="ovTitle">准备好了吗？</h2>
      <p id="ovMsg">用方向键 上 下 左 右 控制小蛇，吃掉苹果就能长大！</p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div class="tip">提示：方向键移动 / 空格暂停</div>
  <div class="pad" id="pad">
    <button class="up" data-dir="up">上</button>
    <button class="left" data-dir="left">左</button>
    <button class="right" data-dir="right">右</button>
    <button class="down" data-dir="down">下</button>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovMsg = document.getElementById('ovMsg');
  const startBtn = document.getElementById('startBtn');

  const COLS = 20, ROWS = 20;
  const CELL = canvas.width / COLS;

  let snake, dir, nextDir, food, score, best, running, paused, timer;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  const ENCOURAGE = [
    "差一点点！再来一次一定行！",
    "勇敢的小冒险家，再试试看！",
    "好棒！这次比上次更厉害了！",
    "失败是成功的好朋友，再来！",
    "你已经很棒啦，再来一局！"
  ];

  function reset() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    scoreEl.textContent = score;
    placeFood();
    paused = false;
  }

  function placeFood() {
    while (true) {
      const fx = Math.floor(Math.random() * COLS);
      const fy = Math.floor(Math.random() * ROWS);
      if (!snake.some(s => s.x === fx && s.y === fy)) {
        food = {x: fx, y: fy};
        return;
      }
    }
  }

  function step() {
    if (paused || !running) return;
    if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#f4fff4';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#e6f5e6';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    ctx.fillStyle = '#ff5252';
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7cb342';
    ctx.fillRect(fx - 2, food.y * CELL + 2, 4, 6);

    snake.forEach((s, i) => {
      const x = s.x * CELL, y = s.y * CELL;
      ctx.fillStyle = i === 0 ? '#2e8b57' : '#4caf50';
      ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);
      if (i === 0) {
        ctx.fillStyle = '#fff';
        const ex1 = x + CELL * 0.3, ey1 = y + CELL * 0.3;
        const ex2 = x + CELL * 0.7, ey2 = y + CELL * 0.3;
        ctx.beginPath(); ctx.arc(ex1, ey1, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2, ey2, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(ex1, ey1, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2, ey2, 1.5, 0, Math.PI * 2); ctx.fill();
      }
    });
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', String(best));
      bestEl.textContent = best;
    }
    const msg = ENCOURAGE[Math.floor(Math.random() * ENCOURAGE.length)];
    ovTitle.textContent = '游戏结束';
    ovMsg.textContent = '本局得分 ' + score + ' 分。' + msg;
    startBtn.textContent = '再来一局';
    overlay.classList.add('show');
  }

  function start() {
    reset();
    running = true;
    overlay.classList.remove('show');
    clearInterval(timer);
    timer = setInterval(step, 180);
    draw();
  }

  function setDir(d) {
    if (!running) return;
    if (d === 'up'    && dir.y !== 1)  nextDir = {x: 0,  y: -1};
    if (d === 'down'  && dir.y !== -1) nextDir = {x: 0,  y: 1};
    if (d === 'left'  && dir.x !== 1)  nextDir = {x: -1, y: 0};
    if (d === 'right' && dir.x !== -1) nextDir = {x: 1,  y: 0};
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W')    { setDir('up');    e.preventDefault(); }
    else if (k === 'ArrowDown'  || k === 's' || k === 'S') { setDir('down');  e.preventDefault(); }
    else if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { setDir('left');  e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { setDir('right'); e.preventDefault(); }
    else if (k === ' ') { if (running) paused = !paused; e.preventDefault(); }
  });

  document.getElementById('pad').addEventListener('click', (e) => {
    const d = e.target && e.target.dataset && e.target.dataset.dir;
    if (d) setDir(d);
  });

  startBtn.addEventListener('click', start);

  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  food = {x: 5, y: 5};
  draw();
})();
</script>
</body>
</html>
