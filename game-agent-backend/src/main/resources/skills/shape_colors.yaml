name: shape_colors
displayName: 形状颜色大冒险
description: 图形识别与颜色分类互动游戏，适合4-6岁幼儿，通过拖拽和点击认识基本形状和颜色
ageGroup: "4-6"
difficulty:
  - easy
tags:
  - 形状
  - 颜色
  - 认知
  - 分类
gameType: matching

template: |
  <!DOCTYPE html>
  <html lang="zh-CN">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>形状颜色大冒险</title>
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: 'Comic Sans MS', cursive, sans-serif; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
          .game-container { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 650px; width: 100%; text-align: center; }
          h1 { color: #e91e63; font-size: 28px; margin-bottom: 10px; }
          .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
          .score-bar { display: flex; justify-content: space-between; margin-bottom: 20px; padding: 10px 15px; background: #fce4ec; border-radius: 10px; }
          .score-bar span { font-size: 16px; font-weight: bold; color: #c2185b; }
          .question-area { margin: 20px 0; }
          .question-text { font-size: 22px; color: #333; margin-bottom: 15px; }
          .target-shape { width: 120px; height: 120px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
          .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
          .option-btn { padding: 20px; border: 3px solid #e0e0e0; border-radius: 15px; background: #fff; cursor: pointer; font-size: 18px; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
          .option-btn:hover { border-color: #e91e63; transform: scale(1.05); }
          .option-btn.correct { border-color: #4caf50; background: #e8f5e9; }
          .option-btn.wrong { border-color: #f44336; background: #ffebee; }
          .option-shape { width: 60px; height: 60px; }
          .feedback { font-size: 24px; margin: 15px 0; min-height: 40px; }
          .start-btn, .restart-btn { padding: 15px 40px; font-size: 20px; border: none; border-radius: 25px; cursor: pointer; background: linear-gradient(135deg, #e91e63, #f06292); color: white; margin: 10px; transition: transform 0.2s; }
          .start-btn:hover, .restart-btn:hover { transform: scale(1.05); }
          .hidden { display: none; }
          .result-area { margin-top: 20px; }
          .result-area h2 { color: #e91e63; margin-bottom: 10px; }
      </style>
  </head>
  <body>
      <div class="game-container">
          <h1>🔷 形状颜色大冒险 🔶</h1>
          <p class="subtitle">认识形状和颜色，做最棒的小画家！</p>

          <div id="startScreen">
              <p style="font-size:18px; margin:20px 0;">准备好认识各种形状和颜色了吗？</p>
              <button class="start-btn" onclick="startGame()">🎨 开始冒险</button>
          </div>

          <div id="gameScreen" class="hidden">
              <div class="score-bar">
                  <span>⭐ 得分: <span id="score">0</span></span>
                  <span>📝 第 <span id="current">1</span>/8 题</span>
              </div>
              <div class="question-area">
                  <div class="question-text" id="question"></div>
                  <div class="target-shape" id="targetShape"></div>
              </div>
              <div class="options" id="options"></div>
              <div class="feedback" id="feedback"></div>
          </div>

          <div id="resultScreen" class="hidden">
              <div class="result-area">
                  <h2 id="resultTitle"></h2>
                  <p id="resultText" style="font-size:18px; margin:10px 0;"></p>
                  <p style="font-size:16px; color:#666;">最终得分: <span id="finalScore"></span> 分</p>
                  <button class="restart-btn" onclick="startGame()">🔄 再玩一次</button>
              </div>
          </div>
      </div>

      <script>
          const SHAPES = [
              { name: '圆形', emoji: '⭕', color: '#f44336', svg: '<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="{color}"/></svg>' },
              { name: '正方形', emoji: '🟧', color: '#ff9800', svg: '<svg viewBox="0 0 60 60"><rect x="8" y="8" width="44" height="44" fill="{color}"/></svg>' },
              { name: '三角形', emoji: '🔺', color: '#4caf50', svg: '<svg viewBox="0 0 60 60"><polygon points="30,5 55,55 5,55" fill="{color}"/></svg>' },
              { name: '菱形', emoji: '🔷', color: '#2196f3', svg: '<svg viewBox="0 0 60 60"><polygon points="30,5 55,30 30,55 5,30" fill="{color}"/></svg>' },
              { name: '五角星', emoji: '⭐', color: '#ffeb3b', svg: '<svg viewBox="0 0 60 60"><polygon points="30,5 37,22 55,22 40,34 46,52 30,42 14,52 20,34 5,22 23,22" fill="{color}"/></svg>' },
              { name: '心形', emoji: '❤️', color: '#e91e63', svg: '<svg viewBox="0 0 60 60"><path d="M30,50 C15,38 5,28 5,18 C5,10 12,5 20,5 C25,5 28,8 30,12 C32,8 35,5 40,5 C48,5 55,10 55,18 C55,28 45,38 30,50Z" fill="{color}"/></svg>' }
          ];
          const COLORS = [
              { name: '红色', hex: '#f44336' },
              { name: '蓝色', hex: '#2196f3' },
              { name: '绿色', hex: '#4caf50' },
              { name: '黄色', hex: '#ffeb3b' },
              { name: '紫色', hex: '#9c27b0' },
              { name: '橙色', hex: '#ff9800' }
          ];

          let score = 0, currentQ = 0, totalQ = 8, questions = [];

          function startGame() {
              score = 0; currentQ = 0;
              questions = generateQuestions();
              document.getElementById('startScreen').classList.add('hidden');
              document.getElementById('resultScreen').classList.add('hidden');
              document.getElementById('gameScreen').classList.remove('hidden');
              document.getElementById('score').textContent = '0';
              showQuestion();
          }

          function generateQuestions() {
              let qs = [];
              for (let i = 0; i < totalQ; i++) {
                  if (i % 2 === 0) {
                      // 形状识别题
                      let shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                      let color = COLORS[Math.floor(Math.random() * COLORS.length)];
                      let wrongShapes = SHAPES.filter(s => s.name !== shape.name).sort(() => Math.random() - 0.5).slice(0, 3);
                      let options = [...wrongShapes.map(s => ({ label: s.name, svg: s.svg.replace('{color}', color.hex) })),
                                     { label: shape.name, svg: shape.svg.replace('{color}', color.hex), correct: true }]
                                    .sort(() => Math.random() - 0.5);
                      qs.push({ type: 'shape', question: '这是什么形状？', targetSvg: shape.svg.replace('{color}', color.hex), options, answer: shape.name });
                  } else {
                      // 颜色识别题
                      let color = COLORS[Math.floor(Math.random() * COLORS.length)];
                      let shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                      let wrongColors = COLORS.filter(c => c.name !== color.name).sort(() => Math.random() - 0.5).slice(0, 3);
                      let options = [...wrongColors.map(c => ({ label: c.name, hex: c.hex })),
                                     { label: color.name, hex: color.hex, correct: true }]
                                    .sort(() => Math.random() - 0.5);
                      qs.push({ type: 'color', question: '这个图形是什么颜色？', targetSvg: shape.svg.replace('{color}', color.hex), options, answer: color.name });
                  }
              }
              return qs;
          }

          function showQuestion() {
              if (currentQ >= totalQ) { showResult(); return; }
              let q = questions[currentQ];
              document.getElementById('current').textContent = currentQ + 1;
              document.getElementById('question').textContent = q.question;
              document.getElementById('targetShape').innerHTML = q.targetSvg;
              document.getElementById('feedback').textContent = '';
              let optDiv = document.getElementById('options');
              optDiv.innerHTML = '';
              q.options.forEach((opt, idx) => {
                  let btn = document.createElement('button');
                  btn.className = 'option-btn';
                  if (q.type === 'color') {
                      btn.innerHTML = '<div style="width:40px;height:40px;border-radius:50%;background:' + opt.hex + '"></div>' + opt.label;
                  } else {
                      btn.innerHTML = '<div class="option-shape">' + opt.svg + '</div>' + opt.label;
                  }
                  btn.onclick = () => checkAnswer(opt.label, q.answer, btn);
                  optDiv.appendChild(btn);
              });
          }

          function checkAnswer(selected, answer, btn) {
              let btns = document.querySelectorAll('.option-btn');
              btns.forEach(b => b.onclick = null);
              if (selected === answer) {
                  btn.classList.add('correct');
                  score += 10;
                  document.getElementById('score').textContent = score;
                  document.getElementById('feedback').textContent = '🎉 太棒了！答对了！';
              } else {
                  btn.classList.add('wrong');
                  btns.forEach(b => { if (b.textContent.includes(answer)) b.classList.add('correct'); });
                  document.getElementById('feedback').textContent = '💪 没关系，正确答案是: ' + answer;
              }
              currentQ++;
              setTimeout(showQuestion, 1500);
          }

          function showResult() {
              document.getElementById('gameScreen').classList.add('hidden');
              document.getElementById('resultScreen').classList.remove('hidden');
              document.getElementById('finalScore').textContent = score;
              if (score >= 60) {
                  document.getElementById('resultTitle').textContent = '🌟 你是形状颜色小达人！';
                  document.getElementById('resultText').textContent = '你认识了好多形状和颜色，真厉害！';
              } else {
                  document.getElementById('resultTitle').textContent = '👏 继续加油！';
                  document.getElementById('resultText').textContent = '多多练习，你一定能认识所有的形状和颜色！';
              }
          }
      </script>
  </body>
  </html>

promptHint: |
  参考此模板的结构和交互模式，根据用户需求调整：
  - 形状种类（基本形状 vs 扩展形状如六边形、椭圆等）
  - 颜色范围（基本三原色 vs 更多颜色）
  - 题目类型（识别形状、识别颜色、颜色+形状组合）
  - 视觉主题（动物形状、水果颜色等）
  - 难度（4-5岁简单形状 vs 5-6岁混合题）

evaluationCriteria:
  - 形状和颜色展示是否清晰可辨
  - 点击选项后是否有明确的对错反馈
  - 是否有计分系统且分数正确累计
  - 题目是否随机生成
  - 所有元素是否在可见区域内
  - 适合4-6岁幼儿的认知水平
  - 鼓励式反馈（失败时不惩罚）

fixHints:
  - symptom: 形状颜色与题目不匹配
    solution: 确保随机生成题目时，正确答案包含在选项列表中且位置随机化
  - symptom: 拖拽功能在移动端失效
    solution: 同时监听 touch 和 mouse 事件，使用 e.touches[0] 获取触摸坐标
  - symptom: 选项按钮点击无响应
    solution: 检查事件委托是否正确，确保动态生成的按钮也绑定了点击事件
