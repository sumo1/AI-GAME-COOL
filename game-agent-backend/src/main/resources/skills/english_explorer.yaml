name: english_explorer
displayName: 英语探险家
description: 英语词汇学习游戏，包含看图选词、听音选图、单词拼写三种模式，适合5-9岁儿童
ageGroup: "5-9"
difficulty:
  - easy
  - medium
  - hard
tags:
  - 英语
  - 词汇
  - 拼写
  - 听力
gameType: quiz

template: |
  <!DOCTYPE html>
  <html lang="zh-CN">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>快乐学英语</title>
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
          body { font-family: 'Comic Sans MS', cursive, sans-serif; background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
          .game-container { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 600px; width: 100%; }
          h1 { text-align: center; color: #333; margin-bottom: 15px; font-size: 1.6em; }
          .score-board { display: flex; justify-content: space-around; margin-bottom: 15px; flex-wrap: wrap; gap: 8px; }
          .score-item { background: #f0f0f0; padding: 8px 14px; border-radius: 10px; font-size: 15px; }
          .progress { height: 14px; background: #ecf0f1; border-radius: 7px; overflow: hidden; margin-bottom: 15px; }
          .progress-bar { height: 100%; background: linear-gradient(90deg, #22c55e, #10b981); transition: width 0.5s; }
          .question-area { background: #f8f9fa; padding: 25px; border-radius: 15px; margin-bottom: 20px; text-align: center; }
          .emoji-display { font-size: 5em; margin-bottom: 15px; }
          .word-display { font-size: 2em; color: #1e293b; margin-bottom: 15px; font-weight: bold; letter-spacing: 3px; min-height: 1.2em; }
          .sound-btn { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 12px 24px; border-radius: 50px; font-size: 1.1em; cursor: pointer; margin-bottom: 15px; }
          .sound-btn:active { transform: scale(0.95); }
          .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
          .option-btn { padding: 16px; font-size: 1.3em; border: none; border-radius: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; cursor: pointer; transition: transform 0.2s; min-height: 60px; }
          .option-btn:active { transform: scale(0.95); }
          .option-btn.correct { background: linear-gradient(135deg, #22c55e, #10b981); animation: pulse 0.5s; }
          .option-btn.wrong { background: linear-gradient(135deg, #ef4444, #dc2626); animation: shake 0.4s; }
          .option-btn:disabled { opacity: 0.7; cursor: default; }
          @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
          @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
          .letter-container { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 15px; }
          .letter-tile { width: 50px; height: 50px; background: white; border: 3px solid #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4em; font-weight: bold; cursor: pointer; transition: all 0.2s; }
          .letter-tile.selected { background: #fbbf24; border-color: #f59e0b; transform: scale(1.05); }
          .letter-tile:active { transform: scale(0.9); }
          .feedback { font-size: 1.1em; margin-top: 10px; min-height: 1.5em; }
          .result { display: none; text-align: center; padding: 20px; }
          .result.show { display: block; }
          .result h2 { font-size: 1.5em; margin-bottom: 10px; }
          .restart-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 1.1em; cursor: pointer; margin-top: 10px; }
          .mode-select { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 15px; }
          .mode-btn { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; border: none; padding: 14px 20px; border-radius: 15px; font-size: 1em; cursor: pointer; flex: 1; min-width: 120px; }
          .mode-btn:active { transform: scale(0.95); }
          .reset-btn { background: #6b7280; color: white; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 0.9em; }
      </style>
  </head>
  <body>
      <div class="game-container">
          <h1>🌟 快乐学英语 🐾</h1>

          <!-- 模式选择 -->
          <div id="modeScreen">
              <p style="text-align:center; margin-bottom:15px; font-size:1.1em;">选择游戏模式：</p>
              <div class="mode-select">
                  <button class="mode-btn" onclick="startGame(1)">📖 看图选词</button>
                  <button class="mode-btn" onclick="startGame(2)">👂 听音选图</button>
                  <button class="mode-btn" onclick="startGame(3)">✏️ 单词拼写</button>
              </div>
          </div>

          <!-- 游戏区 -->
          <div id="gameScreen" style="display:none">
              <div class="score-board">
                  <div class="score-item">🎯 分数: <span id="score">0</span></div>
                  <div class="score-item">📊 进度: <span id="current">1</span>/10</div>
                  <div class="score-item">🔥 连击: <span id="streak">0</span></div>
              </div>
              <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
              <div class="question-area">
                  <div class="emoji-display" id="emojiDisplay"></div>
                  <div class="word-display" id="wordDisplay"></div>
                  <button class="sound-btn" id="soundBtn" style="display:none" onclick="speakWord()">🔊 播放发音</button>
                  <div class="letter-container" id="letterContainer"></div>
                  <button class="reset-btn" id="resetLettersBtn" style="display:none" onclick="resetLetters()">🔄 重置</button>
              </div>
              <div class="options" id="optionsContainer"></div>
              <div class="feedback" id="feedback"></div>
          </div>

          <!-- 结果 -->
          <div class="result" id="result">
              <h2>🎉 游戏完成！</h2>
              <p>总分: <span id="finalScore"></span></p>
              <p>正确率: <span id="accuracy"></span>%</p>
              <p id="encouragement"></p>
              <button class="restart-btn" onclick="backToMenu()">再玩一次</button>
          </div>
      </div>
      <script>
          const VOCAB = [
              { word: 'CAT', zh: '猫', emoji: '🐱' },
              { word: 'DOG', zh: '狗', emoji: '🐶' },
              { word: 'BIRD', zh: '鸟', emoji: '🐦' },
              { word: 'FISH', zh: '鱼', emoji: '🐟' },
              { word: 'RABBIT', zh: '兔子', emoji: '🐰' },
              { word: 'LION', zh: '狮子', emoji: '🦁' },
              { word: 'MONKEY', zh: '猴子', emoji: '🐵' },
              { word: 'PANDA', zh: '熊猫', emoji: '🐼' },
              { word: 'APPLE', zh: '苹果', emoji: '🍎' },
              { word: 'BANANA', zh: '香蕉', emoji: '🍌' },
              { word: 'ORANGE', zh: '橙子', emoji: '🍊' },
              { word: 'GRAPE', zh: '葡萄', emoji: '🍇' }
          ];

          const TOTAL = 10;
          let mode = 1, score = 0, streakCount = 0, correctCount = 0, currentIdx = 0;
          let wordList = [], currentWord = null, selectedLetters = [];

          function shuffle(arr) {
              const a = [...arr];
              for (let i = a.length - 1; i > 0; i--) {
                  const j = Math.floor(Math.random() * (i + 1));
                  [a[i], a[j]] = [a[j], a[i]];
              }
              return a;
          }

          function speakWord() {
              if ('speechSynthesis' in window && currentWord) {
                  const u = new SpeechSynthesisUtterance(currentWord.word);
                  u.lang = 'en-US'; u.rate = 0.8;
                  speechSynthesis.speak(u);
              }
          }

          function startGame(m) {
              mode = m; score = 0; streakCount = 0; correctCount = 0; currentIdx = 0;
              wordList = shuffle(VOCAB).slice(0, TOTAL);
              document.getElementById('modeScreen').style.display = 'none';
              document.getElementById('gameScreen').style.display = 'block';
              document.getElementById('result').classList.remove('show');
              updateDisplay();
              nextQuestion();
          }

          function backToMenu() {
              document.getElementById('modeScreen').style.display = 'block';
              document.getElementById('gameScreen').style.display = 'none';
              document.getElementById('result').classList.remove('show');
          }

          function updateDisplay() {
              document.getElementById('score').textContent = score;
              document.getElementById('current').textContent = Math.min(currentIdx + 1, TOTAL);
              document.getElementById('streak').textContent = streakCount;
              document.getElementById('progressBar').style.width = (currentIdx / TOTAL * 100) + '%';
          }

          function nextQuestion() {
              if (currentIdx >= TOTAL) { showResult(); return; }
              currentWord = wordList[currentIdx % wordList.length];
              selectedLetters = [];
              document.getElementById('optionsContainer').innerHTML = '';
              document.getElementById('letterContainer').innerHTML = '';
              document.getElementById('feedback').textContent = '';
              document.getElementById('resetLettersBtn').style.display = 'none';

              if (mode === 1) setupMode1();
              else if (mode === 2) setupMode2();
              else setupMode3();
              updateDisplay();
          }

          function setupMode1() {
              document.getElementById('emojiDisplay').textContent = currentWord.emoji;
              document.getElementById('emojiDisplay').style.display = 'block';
              document.getElementById('wordDisplay').textContent = currentWord.zh;
              document.getElementById('soundBtn').style.display = 'none';
              const opts = generateWordOptions(currentWord);
              const container = document.getElementById('optionsContainer');
              opts.forEach(o => {
                  const btn = document.createElement('button');
                  btn.className = 'option-btn';
                  btn.textContent = o.word;
                  btn.onclick = () => checkAnswer(btn, o.word === currentWord.word);
                  container.appendChild(btn);
              });
          }

          function setupMode2() {
              document.getElementById('emojiDisplay').textContent = '🔊';
              document.getElementById('emojiDisplay').style.display = 'block';
              document.getElementById('wordDisplay').textContent = '听声音，选图片';
              document.getElementById('soundBtn').style.display = 'inline-block';
              setTimeout(speakWord, 500);
              const opts = generateWordOptions(currentWord);
              const container = document.getElementById('optionsContainer');
              opts.forEach(o => {
                  const btn = document.createElement('button');
                  btn.className = 'option-btn';
                  btn.style.fontSize = '2.5em';
                  btn.textContent = o.emoji;
                  btn.onclick = () => checkAnswer(btn, o.word === currentWord.word);
                  container.appendChild(btn);
              });
          }

          function setupMode3() {
              document.getElementById('emojiDisplay').textContent = currentWord.emoji;
              document.getElementById('emojiDisplay').style.display = 'block';
              document.getElementById('wordDisplay').textContent = '';
              document.getElementById('soundBtn').style.display = 'inline-block';
              document.getElementById('resetLettersBtn').style.display = 'inline-block';
              const letters = shuffle(currentWord.word.split(''));
              const container = document.getElementById('letterContainer');
              letters.forEach((letter, idx) => {
                  const tile = document.createElement('div');
                  tile.className = 'letter-tile';
                  tile.textContent = letter;
                  tile.dataset.idx = idx;
                  tile.onclick = () => {
                      if (tile.classList.contains('selected')) return;
                      tile.classList.add('selected');
                      selectedLetters.push(letter);
                      document.getElementById('wordDisplay').textContent = selectedLetters.join('');
                      if (selectedLetters.length === currentWord.word.length) {
                          const correct = selectedLetters.join('') === currentWord.word;
                          handleSpellingResult(correct);
                      }
                  };
                  container.appendChild(tile);
              });
          }

          function resetLetters() {
              selectedLetters = [];
              document.getElementById('wordDisplay').textContent = '';
              document.querySelectorAll('.letter-tile').forEach(t => t.classList.remove('selected'));
          }

          function generateWordOptions(correct) {
              const opts = [correct];
              const pool = VOCAB.filter(v => v.word !== correct.word);
              while (opts.length < 4 && pool.length > 0) {
                  const idx = Math.floor(Math.random() * pool.length);
                  opts.push(pool.splice(idx, 1)[0]);
              }
              return shuffle(opts);
          }

          function checkAnswer(el, isCorrect) {
              document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
              if (isCorrect) {
                  el.classList.add('correct');
                  handleCorrect();
              } else {
                  el.classList.add('wrong');
                  handleWrong();
              }
              setTimeout(() => { currentIdx++; nextQuestion(); }, 1500);
          }

          function handleSpellingResult(correct) {
              if (correct) {
                  document.querySelectorAll('.letter-tile').forEach(t => { t.style.background = '#22c55e'; t.style.color = 'white'; });
                  handleCorrect();
                  setTimeout(() => { currentIdx++; nextQuestion(); }, 1500);
              } else {
                  document.querySelectorAll('.letter-tile.selected').forEach(t => { t.style.background = '#ef4444'; t.style.color = 'white'; });
                  handleWrong();
                  setTimeout(resetLetters, 1000);
              }
          }

          function handleCorrect() {
              const base = mode === 1 ? 10 : mode === 2 ? 15 : 20;
              streakCount++;
              const bonus = streakCount >= 3 ? 30 : 0;
              score += base + bonus;
              correctCount++;
              document.getElementById('feedback').textContent = bonus > 0 ? '🎉 太棒了！连击奖励 +' + (base + bonus) : '✅ 正确！+' + base;
              speakWord();
          }

          function handleWrong() {
              streakCount = 0;
              document.getElementById('feedback').textContent = '💪 正确答案是 ' + currentWord.word + ' (' + currentWord.zh + ')';
          }

          function showResult() {
              document.getElementById('gameScreen').style.display = 'none';
              const acc = Math.round(correctCount / TOTAL * 100);
              document.getElementById('finalScore').textContent = score;
              document.getElementById('accuracy').textContent = acc;
              const msg = acc >= 90 ? '🏆 你是英语小天才！' : acc >= 70 ? '⭐ 非常棒，继续加油！' : acc >= 50 ? '👍 不错哦，多练习会更好！' : '💪 加油，再试一次！';
              document.getElementById('encouragement').textContent = msg;
              document.getElementById('result').classList.add('show');
          }
      </script>
  </body>
  </html>

promptHint: |
  参考此模板的结构和交互模式，但根据用户的具体需求调整：
  - 词汇主题（动物/水果/颜色/数字/身体部位等）
  - 游戏模式（看图选词/听音选图/单词拼写）
  - 难度级别（简单3-4字母词/中等5-6字母词/复杂7+字母词）
  - 是否启用发音功能（Web Speech API）
  - 连击奖励和成就系统
  - 可增加中文提示辅助学习

evaluationCriteria:
  - 词汇内容是否适合目标年龄段
  - 三种游戏模式是否都能正常运行
  - 看图选词模式：图片/emoji与选项是否匹配
  - 听音选图模式：发音功能是否正常
  - 单词拼写模式：字母选择和重置是否正常
  - 答对/答错是否有明确反馈
  - 计分和连击系统是否正确
  - 游戏完成后是否显示正确率和鼓励语
