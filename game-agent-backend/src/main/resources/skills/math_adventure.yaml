name: math_adventure
displayName: 数学冒险
description: 10以内加减法互动游戏，适合4-8岁儿童，包含计分系统和进度反馈
ageGroup: "4-8"
difficulty:
  - easy
  - medium
tags:
  - 数学
  - 加法
  - 减法
  - 计算
gameType: quiz

template: |
  <!DOCTYPE html>
  <html lang="zh-CN">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>数学冒险</title>
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: 'Comic Sans MS', cursive, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
          .game-container { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 600px; width: 100%; }
          h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 1.8em; }
          .score-board { display: flex; justify-content: space-around; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
          .score-item { background: #f0f0f0; padding: 8px 16px; border-radius: 10px; font-size: 16px; }
          .question-container { background: #f8f9fa; padding: 30px; border-radius: 15px; margin-bottom: 20px; text-align: center; }
          .question { font-size: 2.2em; color: #2c3e50; margin-bottom: 25px; font-weight: bold; }
          .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
          .option-btn { padding: 16px; font-size: 1.4em; border: none; border-radius: 12px; background: linear-gradient(45deg, #3498db, #2ecc71); color: white; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
          .option-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
          .option-btn:disabled { opacity: 0.7; cursor: default; transform: none; }
          .option-btn.correct { background: linear-gradient(45deg, #27ae60, #2ecc71); animation: pulse 0.5s; }
          .option-btn.wrong { background: linear-gradient(45deg, #e74c3c, #c0392b); animation: shake 0.4s; }
          @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
          @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
          .progress { height: 16px; background: #ecf0f1; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
          .progress-bar { height: 100%; background: linear-gradient(90deg, #3498db, #2ecc71); transition: width 0.3s; }
          .result { display: none; text-align: center; padding: 20px; }
          .result.show { display: block; }
          .result h2 { font-size: 1.6em; margin-bottom: 12px; }
          .restart-btn { background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 1.1em; cursor: pointer; margin-top: 10px; }
          .restart-btn:hover { background: #2980b9; }
          .feedback { font-size: 1.2em; margin-top: 10px; min-height: 1.5em; }
      </style>
  </head>
  <body>
      <div class="game-container">
          <h1>🎯 数学冒险</h1>
          <div class="score-board">
              <div class="score-item">✅ 正确: <span id="correct">0</span></div>
              <div class="score-item">❌ 错误: <span id="wrong">0</span></div>
              <div class="score-item">📊 进度: <span id="current">1</span>/10</div>
          </div>
          <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
          <div class="question-container">
              <div class="question" id="question"></div>
              <div class="options" id="options"></div>
              <div class="feedback" id="feedback"></div>
          </div>
          <div class="result" id="result">
              <h2>🎉 游戏完成！</h2>
              <p>正确率: <span id="accuracy"></span>%</p>
              <p id="encouragement"></p>
              <button class="restart-btn" onclick="resetGame()">再玩一次</button>
          </div>
      </div>
      <script>
          const TOTAL = 10;
          let questions = [], currentIndex = 0, correctCount = 0, wrongCount = 0;

          function generateQuestions() {
              questions = [];
              for (let i = 0; i < TOTAL; i++) {
                  const ops = ['+', '-'];
                  const op = ops[Math.floor(Math.random() * ops.length)];
                  let a = Math.floor(Math.random() * 10) + 1;
                  let b = Math.floor(Math.random() * 10) + 1;
                  if (op === '-' && a < b) { [a, b] = [b, a]; }
                  const answer = op === '+' ? a + b : a - b;
                  const options = generateOptions(answer);
                  questions.push({ a, b, op, answer, options });
              }
          }

          function generateOptions(correct) {
              const opts = new Set([correct]);
              while (opts.size < 4) {
                  const offset = Math.floor(Math.random() * 10) - 5;
                  const v = correct + offset;
                  if (v >= 0) opts.add(v);
              }
              return [...opts].sort(() => Math.random() - 0.5);
          }

          function displayQuestion() {
              if (currentIndex >= TOTAL) { showResult(); return; }
              const q = questions[currentIndex];
              document.getElementById('question').textContent = q.a + ' ' + q.op + ' ' + q.b + ' = ?';
              document.getElementById('current').textContent = currentIndex + 1;
              document.getElementById('feedback').textContent = '';
              const optDiv = document.getElementById('options');
              optDiv.innerHTML = '';
              q.options.forEach(opt => {
                  const btn = document.createElement('button');
                  btn.className = 'option-btn';
                  btn.textContent = opt;
                  btn.onclick = () => checkAnswer(opt, q.answer);
                  optDiv.appendChild(btn);
              });
              document.getElementById('progressBar').style.width = (currentIndex / TOTAL * 100) + '%';
          }

          function checkAnswer(selected, correct) {
              const buttons = document.querySelectorAll('.option-btn');
              buttons.forEach(btn => {
                  btn.disabled = true;
                  if (parseInt(btn.textContent) === correct) btn.classList.add('correct');
                  else if (parseInt(btn.textContent) === selected) btn.classList.add('wrong');
              });
              const fb = document.getElementById('feedback');
              if (selected === correct) {
                  correctCount++;
                  document.getElementById('correct').textContent = correctCount;
                  fb.textContent = '🎉 太棒了！';
              } else {
                  wrongCount++;
                  document.getElementById('wrong').textContent = wrongCount;
                  fb.textContent = '💪 没关系，正确答案是 ' + correct;
              }
              setTimeout(() => { currentIndex++; displayQuestion(); }, 1500);
          }

          function showResult() {
              document.querySelector('.question-container').style.display = 'none';
              const resultDiv = document.getElementById('result');
              resultDiv.classList.add('show');
              const acc = Math.round(correctCount / TOTAL * 100);
              document.getElementById('accuracy').textContent = acc;
              const msg = acc >= 80 ? '🌟 你真是数学小天才！' : acc >= 50 ? '👍 继续加油，你很棒！' : '💪 多练习就会越来越好！';
              document.getElementById('encouragement').textContent = msg;
          }

          function resetGame() {
              currentIndex = 0; correctCount = 0; wrongCount = 0;
              document.getElementById('correct').textContent = '0';
              document.getElementById('wrong').textContent = '0';
              document.querySelector('.question-container').style.display = 'block';
              document.getElementById('result').classList.remove('show');
              generateQuestions();
              displayQuestion();
          }

          generateQuestions();
          displayQuestion();
      </script>
  </body>
  </html>

promptHint: |
  参考此模板的结构和交互模式，但根据用户的具体需求调整：
  - 数学运算类型（加/减/乘/除）
  - 数值范围（根据年龄段调整）
  - 视觉主题（可更换颜色方案和装饰元素）
  - 难度递进方式（固定/渐进/随机）
  - 题目数量和时间限制

evaluationCriteria:
  - 数学题目难度是否匹配目标年龄段
  - 答对/答错是否有明确的视觉和文字反馈
  - 是否有计分系统且分数正确累计
  - 题目是否随机生成（非固定题库）
  - 游戏区域内所有元素是否在可见范围内
  - 是否有鼓励性的结束语
