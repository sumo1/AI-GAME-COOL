name: memory_master
displayName: 记忆大师
description: 卡片配对翻牌记忆游戏，支持多种主题（动物/太空/海洋），适合4-10岁儿童
ageGroup: "4-10"
difficulty:
  - easy
  - medium
  - hard
tags:
  - 记忆力
  - 配对
  - 翻牌
  - 专注力
gameType: memory

template: |
  <!DOCTYPE html>
  <html lang="zh-CN">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>记忆翻牌游戏</title>
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: 'Comic Sans MS', cursive, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
          .game-container { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 600px; width: 100%; }
          h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 1.8em; }
          .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 16px; flex-wrap: wrap; gap: 8px; }
          .stat { background: #f0f0f0; padding: 8px 16px; border-radius: 10px; }
          .game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; justify-content: center; }
          .card { aspect-ratio: 1; background: linear-gradient(45deg, #3498db, #2ecc71); border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 2em; transition: transform 0.6s; transform-style: preserve-3d; position: relative; min-height: 80px; }
          .card.flipped { transform: rotateY(180deg); }
          .card.matched { background: linear-gradient(45deg, #f39c12, #e74c3c); pointer-events: none; animation: bounce 0.5s; }
          .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; border-radius: 10px; }
          .card-front { background: linear-gradient(45deg, #3498db, #2ecc71); color: white; font-size: 1.5em; }
          .card-back { background: white; transform: rotateY(180deg); font-size: 1.8em; }
          @keyframes bounce { 0%, 100% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.1); } }
          .win-message { display: none; text-align: center; margin-top: 20px; font-size: 1.4em; color: #27ae60; font-weight: bold; }
          .restart-btn { display: block; margin: 15px auto 0; background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 25px; cursor: pointer; font-size: 1.1em; }
          .restart-btn:hover { background: #2980b9; }
          @media (max-width: 480px) {
              .game-board { grid-template-columns: repeat(3, 1fr); }
              .card { font-size: 1.5em; }
          }
      </style>
  </head>
  <body>
      <div class="game-container">
          <h1>🎮 记忆翻牌游戏</h1>
          <div class="stats">
              <div class="stat">🔢 步数: <span id="moves">0</span></div>
              <div class="stat">🎯 配对: <span id="pairs">0</span>/<span id="totalPairs">6</span></div>
              <div class="stat">⏱️ 时间: <span id="time">0</span>秒</div>
          </div>
          <div class="game-board" id="gameBoard"></div>
          <div class="win-message" id="winMessage">
              <p>🎉 恭喜你赢了！</p>
              <p id="winStats"></p>
          </div>
          <button class="restart-btn" onclick="resetGame()">重新开始</button>
      </div>
      <script>
          const THEMES = {
              animals: ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯'],
              space:   ['🚀','🛸','🌟','⭐','🌙','☄️','🌍','🪐','👽','🛰️'],
              ocean:   ['🐠','🐟','🐡','🦈','🐙','🦀','🦞','🦐','🐚','🐳']
          };
          const DIFFICULTY = { easy: 6, medium: 8, hard: 10 };

          let pairCount = DIFFICULTY.easy;
          let theme = THEMES.animals;
          let icons = theme.slice(0, pairCount);
          let cards = [...icons, ...icons];
          let flippedCards = [];
          let matchedPairs = 0;
          let moves = 0;
          let startTime = Date.now();
          let timerInterval;

          function shuffle(arr) {
              for (let i = arr.length - 1; i > 0; i--) {
                  const j = Math.floor(Math.random() * (i + 1));
                  [arr[i], arr[j]] = [arr[j], arr[i]];
              }
              return arr;
          }

          function createBoard() {
              const board = document.getElementById('gameBoard');
              board.innerHTML = '';
              document.getElementById('totalPairs').textContent = pairCount;
              shuffle(cards).forEach((icon, index) => {
                  const card = document.createElement('div');
                  card.className = 'card';
                  card.dataset.icon = icon;
                  card.dataset.index = index;
                  card.innerHTML = '<div class="card-front">?</div><div class="card-back">' + icon + '</div>';
                  card.addEventListener('click', flipCard);
                  board.appendChild(card);
              });
          }

          function flipCard() {
              if (flippedCards.length >= 2) return;
              if (this.classList.contains('flipped') || this.classList.contains('matched')) return;
              this.classList.add('flipped');
              flippedCards.push(this);
              if (flippedCards.length === 2) {
                  moves++;
                  document.getElementById('moves').textContent = moves;
                  checkMatch();
              }
          }

          function checkMatch() {
              const [c1, c2] = flippedCards;
              const match = c1.dataset.icon === c2.dataset.icon;
              setTimeout(() => {
                  if (match) {
                      c1.classList.add('matched');
                      c2.classList.add('matched');
                      matchedPairs++;
                      document.getElementById('pairs').textContent = matchedPairs;
                      if (matchedPairs === pairCount) endGame();
                  } else {
                      c1.classList.remove('flipped');
                      c2.classList.remove('flipped');
                  }
                  flippedCards = [];
              }, 800);
          }

          function endGame() {
              clearInterval(timerInterval);
              const elapsed = Math.floor((Date.now() - startTime) / 1000);
              const winMsg = document.getElementById('winMessage');
              const stars = moves <= pairCount * 2 ? '🌟🌟🌟' : moves <= pairCount * 3 ? '🌟🌟' : '🌟';
              document.getElementById('winStats').textContent = '用时 ' + elapsed + ' 秒，' + moves + ' 步完成！' + stars;
              winMsg.style.display = 'block';
          }

          function updateTimer() {
              document.getElementById('time').textContent = Math.floor((Date.now() - startTime) / 1000);
          }

          function resetGame() {
              flippedCards = [];
              matchedPairs = 0;
              moves = 0;
              startTime = Date.now();
              document.getElementById('moves').textContent = '0';
              document.getElementById('pairs').textContent = '0';
              document.getElementById('time').textContent = '0';
              document.getElementById('winMessage').style.display = 'none';
              cards = [...icons, ...icons];
              createBoard();
              clearInterval(timerInterval);
              timerInterval = setInterval(updateTimer, 1000);
          }

          createBoard();
          timerInterval = setInterval(updateTimer, 1000);
      </script>
  </body>
  </html>

promptHint: |
  参考此模板的结构和交互模式，但根据用户的具体需求调整：
  - 卡片主题（动物/太空/海洋/恐龙/超级英雄等）
  - 卡片对数（根据年龄和难度：6/8/10 对）
  - 网格布局（3列/4列/5列）
  - 匹配后的动画效果
  - 是否需要计时器或步数限制
  - 可添加声音提示或视觉特效

evaluationCriteria:
  - 卡片翻转动画是否流畅自然
  - 同时只能翻开两张卡片，不能多翻
  - 匹配成功的卡片是否保持显示状态
  - 匹配失败的卡片是否自动翻回
  - 步数和配对数是否正确计数
  - 全部配对后是否有胜利提示
  - 重新开始是否能正确重置游戏状态
  - 所有卡片在可见区域内，不越界
